{# Satu modal konfirmasi hapus untuk semua card. Nama experience yang dipilih
   diisi oleh JavaScript di experience.html lewat openDeleteModal(). #}
<div id="experience-delete-modal"
     class="experience-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="experience-delete-modal-title">
    <button type="button"
            class="experience-delete-modal__close"
            popovertarget="experience-delete-modal"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus">×</button>
    <h2 id="experience-delete-modal-title">Hapus Experience?</h2>
    <p>
        Apakah Anda yakin ingin menghapus
        <strong id="experience-delete-name"></strong>?
    </p>
    <div class="experience-delete-modal__actions">
        <button type="button"
                class="experience-delete-modal__cancel"
                popovertarget="experience-delete-modal"
                popovertargetaction="hide">Batal</button>
        <button type="button"
                id="experience-delete-confirm"
                class="experience-delete-modal__confirm">Ya, Hapus</button>
    </div>
</div>
